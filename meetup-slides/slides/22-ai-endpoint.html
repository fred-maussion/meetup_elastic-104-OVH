<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unmasking (desk)</title>
<link rel="stylesheet" href="style/eweb.css">
<link rel="stylesheet" href="assets/deck.css">
<link rel="stylesheet" href="assets/people.css">
<style>
  h1{font-size:56px;letter-spacing:-2.2px;line-height:1;margin-top:34px}
  .sub{font-size:18px;max-width:460px;margin-top:18px}
  .logo{position:absolute;right:72px;top:36px;width:130px;z-index:3}
  .hd{position:relative;height:210px;margin-top:0}
  .hs{position:absolute;left:0;top:0;width:520px}
  .hs.a{animation:ew-in .6s cubic-bezier(.2,.7,.2,1) .2s both, fo .5s ease 8s forwards}
  .hs.bb{animation:ew-in .7s cubic-bezier(.2,.7,.2,1) 8.2s both}
  @keyframes fo{to{opacity:0}}
  .sb.big1{font-size:18px;padding:12px 17px;max-width:420px}
  .sb.big{font-size:24px;padding:16px 22px;max-width:520px;white-space:nowrap}
</style>
</head>
<body data-foot="OVH × Elastic · Part 5">
<img class="logo in1" src="assets/img/ovh-wordmark.svg" alt="OVHcloud">
<div class="z">
  <div class="eyebrow in1">Plot twist</div>
  <div class="hd">
    <div class="hs a"><h1>Who wrote<br><span class="b">that answer?</span></h1><p class="sub">A very good explanation. Let’s ask.</p></div>
    <div class="hs bb"><h1>It was OVH<br><span class="b">all along.</span></h1><p class="sub">A model hosted on OVH AI Endpoints wrote that explanation.</p></div>
  </div>
</div>
<svg id="stage" class="iso" viewBox="0 0 1280 720"></svg>
<script src="style/eweb.js"></script>
<script src="assets/scenes.js"></script>
<script src="assets/people.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
const aiCube = () => {
  const yp = 24, x0 = 18;
  PPL.poly(sc, yp, [[x0 + 3, 107], [x0 + 25, 107], [x0 + 25, 129], [x0 + 3, 129]], '#fff', {stroke: '#1D1E24', 'stroke-width': 1, style: 'animation:fi .4s ease 1.2s both'});
  PPL.mark(sc, x0 + 6.5, yp, 126, 15, 1.3);
  const g = EW.el('g', {style: 'transform-box:fill-box;transform-origin:center;animation:maskoff .55s cubic-bezier(.5,0,1,.55) 8s both'}, sc.top);
  const P = (x, z) => sc.P(x, yp + .2, z).map(n => n.toFixed(1)).join(',');
  const add = (pts, fill, ex) => EW.el('polygon', Object.assign({points: pts.map(([x, z]) => P(x, z)).join(' '), fill}, ex || {}), g);
  add([[x0 + 1, 105], [x0 + 27, 105], [x0 + 27, 131], [x0 + 1, 131]], '#FEC514', {stroke: '#1D1E24', 'stroke-width': 1.2});
  add([[x0 + 5, 118], [x0 + 11, 118], [x0 + 11, 124], [x0 + 5, 124]], '#1D1E24');
  add([[x0 + 17, 118], [x0 + 23, 118], [x0 + 23, 124], [x0 + 17, 124]], '#1D1E24');
  add([[x0 + 8, 110], [x0 + 20, 110], [x0 + 20, 112], [x0 + 8, 112]], '#1D1E24');
};
const sc = PPL.iso(document.getElementById('stage'), {ox: 330, oy: 470, s: 1.2});
const SCR = {top: '#343741', left: '#1D1E24', right: '#343741'};
sc.rect({x: -24, y: -14, w: 180, d: 170, z: 0, delay: .05, dash: '2 4'});
// desk
[[6,6],[118,6],[6,66],[118,66]].forEach(([x,y]) => sc.box({x, y, w: 6, d: 6, h: 38, c: 'ink', delay: .1, drop: 30, snap: false, shadow: false}));
sc.box({x: 0, y: 0, w: 130, d: 80, z: 38, h: 8, c: 'slate', delay: .2, drop: 40});
// chair + person (seen from behind)
sc.box({x: 22, y: 112, w: 8, d: 8, h: 24, c: 'slate', stroke: false, delay: .25, drop: 30, snap: false, shadow: false});
sc.box({x: 10, y: 100, w: 36, d: 36, z: 24, h: 8, c: 'ink', delay: .3, drop: 40});
sc.box({x: 18, y: 84, w: 8, d: 8, h: 32, c: 'ink', delay: .35, drop: 40, shadow: false});
sc.box({x: 30, y: 84, w: 8, d: 8, h: 32, c: 'ink', delay: .35, drop: 40, shadow: false});
sc.box({x: 16, y: 84, w: 24, d: 26, z: 32, h: 8, c: 'ink', delay: .4, drop: 50});
sc.box({x: 14, y: 106, w: 28, d: 20, z: 32, h: 32, c: 'blue', delay: .45, drop: 60});
sc.box({x: 42, y: 80, w: 8, d: 30, z: 46, h: 8, c: 'blue', delay: .55, drop: 50});
sc.box({x: 6, y: 80, w: 8, d: 30, z: 46, h: 8, c: 'blue', delay: .55, drop: 50});
sc.box({x: 42, y: 72, w: 8, d: 8, z: 46, h: 6, c: 'white', delay: .6, drop: 50});
sc.box({x: 6, y: 72, w: 8, d: 8, z: 46, h: 6, c: 'white', delay: .6, drop: 50});
sc.box({x: 18, y: 108, w: 20, d: 20, z: 64, h: 20, c: 'white', delay: .6, drop: 70});
sc.box({x: 17, y: 107, w: 22, d: 22, z: 78, h: 8, c: 'ink', delay: .65, drop: 70});
sc.box({x: 17, y: 126, w: 22, d: 5, z: 66, h: 14, c: 'ink', delay: .65, drop: 70});
sc.box({x: 15, y: 110, w: 26, d: 4, z: 85, h: 4, c: 'teal', delay: .7, drop: 70});
sc.box({x: 37, y: 112, w: 5, d: 12, z: 68, h: 12, c: 'teal', delay: .7, drop: 70});
sc.box({x: 14, y: 112, w: 5, d: 12, z: 68, h: 12, c: 'teal', delay: .7, drop: 70});
// keyboard + monitors
sc.box({x: 12, y: 50, w: 56, d: 18, z: 46, h: 3, c: 'white', delay: .6, drop: 40, shadow: false});
sc.box({x: 30, y: 10, w: 10, d: 10, z: 46, h: 10, c: 'slate', stroke: false, delay: .5, drop: 40, shadow: false});
sc.box({x: 5, y: 8, w: 62, d: 5, z: 56, h: 40, c: SCR, delay: .65, drop: 60});
sc.box({x: 90, y: 12, w: 8, d: 8, z: 46, h: 8, c: 'slate', stroke: false, delay: .55, drop: 40, shadow: false});
sc.box({x: 72, y: 10, w: 46, d: 5, z: 54, h: 34, c: SCR, delay: .75, drop: 60});
const PINK = {top: '#FFD3E6', left: '#F04E98', right: '#C23A7A'};
sc.box({x: 18, y: 2, w: 28, d: 22, z: 104, h: 28, c: PINK, delay: .9, drop: 120, shadow: false});
sc.box({x: 29, y: 11, w: 4, d: 4, z: 132, h: 7, c: 'ink', delay: .95, drop: 120, shadow: false});
sc.box({x: 27, y: 9, w: 8, d: 8, z: 139, h: 8, c: 'yellow', delay: .98, drop: 120, shadow: false});
sc.run();
aiCube();
// screen content, drawn on the +y face of each monitor
const face = (x0, yf, zb, u0, v0, u1, v1, fill) => EW.el('polygon', {points: [[x0 + u0, yf, zb + v0], [x0 + u1, yf, zb + v0], [x0 + u1, yf, zb + v1], [x0 + u0, yf, zb + v1]].map(([x, y, z]) => sc.P(x, y, z).map(n => n.toFixed(1)).join(',')).join(' '), fill, style: 'animation:fi .4s ease 1.1s both'}, sc.top);
[10, 18, 14, 26, 20, 30].forEach((h, k) => face(5, 13, 56, 6 + k * 9, 4, 12 + k * 9, 4 + h, k === 5 ? '#48EFCF' : '#0B64DD'));
face(5, 13, 56, 4, 34, 58, 36, '#69707D');
const cols = ['#0B64DD','#0B64DD','#0B64DD','#0B64DD','#02BCB7','#02BCB7','#02BCB7','#FF7E62','#FF7E62','#FF7E62','#F04E98'];
cols.forEach((c, i) => face(72, 15, 54, 4 + (i % 4) * 10.5, 4 + Math.floor(i / 4) * 9, 11 + (i % 4) * 10.5, 9 + Math.floor(i / 4) * 9, c));


PPL.bubble('Great explanation. <b style="color:var(--blue)">Which model</b> are you?', {x: 700, y: 160, delay: .5, cls: 'l big1', w: 400});
PPL.bubble('Take off my mask and find out.', {x: 700, y: 262, delay: 1.2, cls: 'l ai big1', w: 330});
PPL.bubble('<b>OVH AI Endpoints.</b> Surprise!', {x: 700, y: 352, delay: 8.4, cls: 'l ai big', w: 420});
const t = document.createElement('div'); t.className = 'tagline'; t.style.cssText = 'left:700px;top:440px;font-size:14px;animation-delay:8.9s';
t.textContent = 'Hosted on OVH AI Endpoints. Not a third-party API.'; document.body.appendChild(t);
})();
</script>
</body>
</html>
